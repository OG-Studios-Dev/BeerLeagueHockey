name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  ios-native:
    name: Native iOS Build & Smoke Test
    runs-on: macos-15
    timeout-minutes: 20
    needs: test
    env:
      XCODE_APP_PATH: /Applications/Xcode_26.3.app
      IOS_SIMULATOR_DEVICE: iPhone 16
      IOS_RUNTIME_NAME: iOS 26.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure iOS artifact paths
        run: |
          echo "IOS_ARTIFACTS_DIR=${RUNNER_TEMP}/ios-smoke-artifacts" >> "$GITHUB_ENV"
          echo "IOS_DERIVED_DATA_PATH=${RUNNER_TEMP}/ios-derived-data" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show selected Xcode
        run: DEVELOPER_DIR="${XCODE_APP_PATH}/Contents/Developer" xcodebuild -version

      - name: Prepare artifact directory
        run: mkdir -p "$IOS_ARTIFACTS_DIR"

      - name: Generate native iOS project
        working-directory: apps/ios
        run: bash scripts/generate_project.sh

      - name: Run native iOS simulator smoke test
        working-directory: apps/ios
        run: bash scripts/smoke_test_sim.sh

      - name: Upload iOS smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-artifacts
          path: ${{ runner.temp }}/ios-smoke-artifacts
          if-no-files-found: ignore
