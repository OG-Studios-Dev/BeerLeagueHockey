name: CI

on:
  push:
    branches: [main, production, release/mobile-auth-env-fix]
  pull_request:
    branches: [main, production, release/mobile-auth-env-fix]

permissions:
  contents: read

jobs:
  changes:
    name: Detect native iOS changes
    runs-on: ubuntu-latest
    outputs:
      ios-native: ${{ steps.paths.outputs.ios-native }}

    steps:
      - name: Checkout code and comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect apps/ios changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi

          if git diff --name-only "$base_sha" "$GITHUB_SHA" -- apps/ios/ | grep -q .; then
            echo "ios-native=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios-native=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check tracked repository artifacts
        run: node scripts/check-repository-hygiene.mjs

      - name: Test repository hygiene guard
        run: node --test scripts/tests/check-repository-hygiene.test.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Hockey Life Times renderer tests
        run: pnpm exec tsx --test packages/hockey-life-times/tests/renderer.test.ts

      - name: Run shipped mobile readiness and UI tests
        if: hashFiles('apps/mobile/scripts/__tests__/testflight-readiness.test.cjs') != ''
        run: >-
          node --import tsx --test
          apps/mobile/scripts/__tests__/testflight-readiness.test.cjs
          apps/mobile/scripts/__tests__/branding-contract.test.cjs
          apps/mobile/tests/ui-rebuild/branding-components.test.ts
          apps/mobile/tests/ui-rebuild/league-logo.test.ts
          apps/mobile/tests/ui-rebuild/league-content-client.test.ts
          apps/mobile/tests/ui-rebuild/league-content-model.test.ts
          apps/mobile/tests/ui-rebuild/league-content-runtime.test.ts

      - name: Run tests
        run: pnpm test

  ios-native:
    name: Native iOS Build & Smoke Test
    runs-on: macos-15
    timeout-minutes: 20
    needs: [changes, lint-and-typecheck, test]
    if: needs.changes.outputs.ios-native == 'true'
    env:
      XCODE_APP_PATH: /Applications/Xcode_26.3.app
      IOS_SIMULATOR_DEVICE: iPhone 16
      IOS_RUNTIME_NAME: iOS 26.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure iOS artifact paths
        run: |
          echo "IOS_ARTIFACTS_DIR=${RUNNER_TEMP}/ios-smoke-artifacts" >> "$GITHUB_ENV"
          echo "IOS_DERIVED_DATA_PATH=${RUNNER_TEMP}/ios-derived-data" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show selected Xcode
        run: DEVELOPER_DIR="${XCODE_APP_PATH}/Contents/Developer" xcodebuild -version

      - name: Prepare artifact directory
        run: mkdir -p "$IOS_ARTIFACTS_DIR"

      - name: Generate native iOS project
        working-directory: apps/ios
        run: bash scripts/generate_project.sh

      - name: Run native iOS simulator smoke test
        working-directory: apps/ios
        run: bash scripts/smoke_test_sim.sh

      - name: Upload iOS smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-artifacts
          path: ${{ runner.temp }}/ios-smoke-artifacts
          if-no-files-found: ignore
